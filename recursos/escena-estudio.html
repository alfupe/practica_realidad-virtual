<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DrumLab VR — Escena 1: Estudio de Producción (Nivel Explorativo)</title>
  
  <!-- Framework WebXR A-Frame 1.6.0 Oficial -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

  <!-- Componentes A-Frame registrados antes de <a-scene> -->
  <script>
    /**
     * Componente studio-navigator:
     * Gestiona la interacción multimodal (clic, toque, puntero láser WebXR)
     * para navegar a la Escena 2 (Secuenciador 4x4).
     */
    AFRAME.registerComponent('studio-navigator', {
      schema: {
        targetUrl: { type: 'string', default: 'escena-secuenciador.html' }
      },

      init: function () {
        const el = this.el;
        const targetUrl = this.data.targetUrl;

        const navigate = (evt) => {
          if (evt) {
            evt.stopPropagation();
          }

          // Breve tono sutil con Web Audio API para feedback auditivo
          try {
            const AudioCtxClass = window.AudioContext || window.webkitAudioContext;
            if (AudioCtxClass) {
              const ctx = new AudioCtxClass();
              const osc = ctx.createOscillator();
              const gain = ctx.createGain();
              osc.type = 'sine';
              osc.frequency.setValueAtTime(440, ctx.currentTime);
              osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.08);
              gain.gain.setValueAtTime(0.12, ctx.currentTime);
              gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.1);
              osc.connect(gain);
              gain.connect(ctx.destination);
              osc.start();
              osc.stop(ctx.currentTime + 0.1);
            }
          } catch (err) {}

          window.location.href = targetUrl;
        };

        // Eventos para puntero, ratón, toque y controles VR
        el.addEventListener('click', navigate);
        el.addEventListener('touchend', navigate);

        // Feedback de cursor en escritorio
        el.addEventListener('mouseenter', () => {
          document.body.style.cursor = 'pointer';
        });

        el.addEventListener('mouseleave', () => {
          document.body.style.cursor = 'default';
        });
      }
    });
  </script>

  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #1a1e24;
      font-family: Helvetica, Arial, sans-serif;
    }
    
    /* Overlay informativo sutil para el visor */
    .hud-overlay {
      position: absolute;
      top: 12px;
      left: 12px;
      z-index: 100;
      color: #f1f5f9;
      background: rgba(15, 23, 42, 0.85);
      padding: 8px 14px;
      border-radius: 4px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      font-size: 13px;
      pointer-events: none;
      line-height: 1.4;
    }
    .hud-overlay strong {
      color: #38bdf8;
    }
  </style>
</head>
<body>
  <!-- HUD superpuesto -->
  <div class="hud-overlay">
    <strong>Escena 1: Estudio de Producción</strong><br>
    Toca o apunta al panel o al controlador Drum Pad para acceder al secuenciador 4&times;4.
  </div>

  <a-scene 
    loading-screen="dotsColor: #38bdf8; backgroundColor: #111827"
    renderer="antialias: true; colorManagement: true"
    vr-mode-ui="enabled: true">
    
    <!-- Gestor de Assets -->
    <a-assets timeout="5000">
      <a-asset-item id="drumpad-model" src="assets/models/oversized_drum_pad.glb"></a-asset-item>
    </a-assets>

    <!-- Iluminación del estudio -->
    <a-light type="ambient" color="#94a3b8" intensity="1.2"></a-light>
    <a-light type="directional" color="#ffffff" intensity="1.5" position="2 5 3" target="#desk"></a-light>
    <a-light type="point" color="#38bdf8" intensity="1.4" distance="6" position="0 2.2 0"></a-light>

    <!-- Fondo / Entorno -->
    <a-sky color="#0f172a"></a-sky>

    <!-- Suelo -->
    <a-plane 
      position="0 0 0" 
      rotation="-90 0 0" 
      width="20" 
      height="20" 
      color="#1e293b" 
      roughness="0.6" 
      metalness="0.2">
    </a-plane>

    <!-- Paredes del estudio -->
    <a-plane position="0 4 -5" width="16" height="8" color="#1e293b" roughness="0.8"></a-plane>
    <a-plane position="-8 4 0" rotation="0 90 0" width="16" height="8" color="#1e293b" roughness="0.8"></a-plane>
    <a-plane position="8 4 0" rotation="0 -90 0" width="16" height="8" color="#1e293b" roughness="0.8"></a-plane>

    <!-- Paneles acústicos diffusers -->
    <a-entity id="acoustic-panels" position="0 2.6 -4.85">
      <a-box position="-3 0 0" width="0.8" height="3" depth="0.15" color="#334155"></a-box>
      <a-box position="-1.5 0 0" width="0.8" height="3" depth="0.15" color="#243044"></a-box>
      <a-box position="0 0 0" width="1.2" height="3" depth="0.15" color="#334155"></a-box>
      <a-box position="1.5 0 0" width="0.8" height="3" depth="0.15" color="#243044"></a-box>
      <a-box position="3 0 0" width="0.8" height="3" depth="0.15" color="#334155"></a-box>
      <!-- Moldura sutil -->
      <a-box position="0 1.8 0.05" width="7.4" height="0.04" depth="0.04" color="#475569"></a-box>
    </a-entity>

    <!-- Mesa Central de Trabajo -->
    <a-entity id="desk" position="0 0 0">
      <!-- Tablero Principal -->
      <a-box position="0 0.88 -0.2" width="2.4" height="0.08" depth="1.2" color="#1a202c" roughness="0.5" metalness="0.3"></a-box>
      <!-- Patas -->
      <a-cylinder position="-1.05 0.44 0.25" radius="0.035" height="0.88" color="#0f172a" metalness="0.7"></a-cylinder>
      <a-cylinder position="1.05 0.44 0.25" radius="0.035" height="0.88" color="#0f172a" metalness="0.7"></a-cylinder>
      <a-cylinder position="-1.05 0.44 -0.65" radius="0.035" height="0.88" color="#0f172a" metalness="0.7"></a-cylinder>
      <a-cylinder position="1.05 0.44 -0.65" radius="0.035" height="0.88" color="#0f172a" metalness="0.7"></a-cylinder>

      <!-- Monitores de Audio (Altavoces derecho e izquierdo) -->
      <a-entity position="-0.95 1.15 -0.45" rotation="0 25 0">
        <a-box width="0.25" height="0.42" depth="0.28" color="#111827" roughness="0.6"></a-box>
        <a-cylinder position="0 -0.06 0.14" rotation="90 0 0" radius="0.08" height="0.02" color="#334155"></a-cylinder>
        <a-cylinder position="0 0.11 0.14" rotation="90 0 0" radius="0.035" height="0.02" color="#64748b"></a-cylinder>
      </a-entity>

      <a-entity position="0.95 1.15 -0.45" rotation="0 -25 0">
        <a-box width="0.25" height="0.42" depth="0.28" color="#111827" roughness="0.6"></a-box>
        <a-cylinder position="0 -0.06 0.14" rotation="90 0 0" radius="0.08" height="0.02" color="#334155"></a-cylinder>
        <a-cylinder position="0 0.11 0.14" rotation="90 0 0" radius="0.035" height="0.02" color="#64748b"></a-cylinder>
      </a-entity>

      <!-- Pantalla / Monitor Frontal del DAW -->
      <a-entity position="0 1.25 -0.7">
        <a-box width="1.1" height="0.6" depth="0.04" color="#0f172a"></a-box>
        <a-plane position="0 0 0.025" width="1.04" height="0.54" color="#1e293b"></a-plane>
        <a-text value="DRUMLAB VR // ESTUDIO DE PRODUCCION" align="center" position="0 0.12 0.03" scale="0.24 0.24 0.24" color="#38bdf8"></a-text>
        <a-text value="WebXR Spatial Audio Workspace 4/4" align="center" position="0 -0.05 0.03" scale="0.18 0.18 0.18" color="#94a3b8"></a-text>
        <!-- Soporte pantalla -->
        <a-box position="0 -0.32 0" width="0.08" height="0.2" depth="0.06" color="#334155"></a-box>
        <a-box position="0 -0.4 0.05" width="0.3" height="0.02" depth="0.2" color="#334155"></a-box>
      </a-entity>

      <!-- CONTROLADOR 3D: Oversized Drum Pad (Mesa Central) -->
      <a-entity 
        id="studio-drumpad"
        position="0 0.94 -0.05"
        rotation="-12 0 0">
        
        <!-- Hitbox interactiva directa sobre el área del pad -->
        <a-box 
          id="drumpad-hitbox"
          class="interactable"
          studio-navigator
          position="0 0.03 0" 
          width="0.82" 
          height="0.08" 
          depth="0.62" 
          material="opacity: 0; transparent: true">
        </a-box>

        <!-- Modelo 3D GLTF oficial -->
        <a-gltf-model 
          src="#drumpad-model" 
          position="0 0.02 0"
          scale="0.38 0.38 0.38"
          visible="false"
          id="drumpad-gltf-node">
        </a-gltf-model>

        <!-- Chasis Procedural Fallback si el GLB tarda o no está disponible -->
        <a-entity id="drumpad-fallback">
          <a-box width="0.76" height="0.05" depth="0.58" color="#1e293b" metalness="0.5" roughness="0.5"></a-box>
          <a-box position="0 -0.01 0.28" width="0.74" height="0.015" depth="0.02" color="#38bdf8"></a-box>

          <!-- Fila 0 (Crash - Ámbar) -->
          <a-box position="-0.21 0.03 -0.15" width="0.11" height="0.025" depth="0.08" color="#d97706"></a-box>
          <a-box position="-0.07 0.03 -0.15" width="0.11" height="0.025" depth="0.08" color="#d97706"></a-box>
          <a-box position="0.07 0.03 -0.15" width="0.11" height="0.025" depth="0.08" color="#d97706"></a-box>
          <a-box position="0.21 0.03 -0.15" width="0.11" height="0.025" depth="0.08" color="#d97706"></a-box>

          <!-- Fila 1 (Hi-Hat - Verde) -->
          <a-box position="-0.21 0.03 -0.05" width="0.11" height="0.025" depth="0.08" color="#059669"></a-box>
          <a-box position="-0.07 0.03 -0.05" width="0.11" height="0.025" depth="0.08" color="#059669"></a-box>
          <a-box position="0.07 0.03 -0.05" width="0.11" height="0.025" depth="0.08" color="#059669"></a-box>
          <a-box position="0.21 0.03 -0.05" width="0.11" height="0.025" depth="0.08" color="#059669"></a-box>

          <!-- Fila 2 (Snare - Azul) -->
          <a-box position="-0.21 0.03 0.05" width="0.11" height="0.025" depth="0.08" color="#0284c7"></a-box>
          <a-box position="-0.07 0.03 0.05" width="0.11" height="0.025" depth="0.08" color="#0284c7"></a-box>
          <a-box position="0.07 0.03 0.05" width="0.11" height="0.025" depth="0.08" color="#0284c7"></a-box>
          <a-box position="0.21 0.03 0.05" width="0.11" height="0.025" depth="0.08" color="#0284c7"></a-box>

          <!-- Fila 3 (Kick - Rojo vino) -->
          <a-box position="-0.21 0.03 0.15" width="0.11" height="0.025" depth="0.08" color="#db2777"></a-box>
          <a-box position="-0.07 0.03 0.15" width="0.11" height="0.025" depth="0.08" color="#db2777"></a-box>
          <a-box position="0.07 0.03 0.15" width="0.11" height="0.025" depth="0.08" color="#db2777"></a-box>
          <a-box position="0.21 0.03 0.15" width="0.11" height="0.025" depth="0.08" color="#db2777"></a-box>

          <a-box position="0 0.03 -0.23" width="0.6" height="0.02" depth="0.05" color="#0f172a"></a-box>
          <a-text value="OVERSIZED DRUM PAD [TOCAR PARA ENTRAR]" align="center" position="0 0.045 -0.23" rotation="-90 0 0" scale="0.18 0.18 0.18" color="#38bdf8"></a-text>
        </a-entity>
      </a-entity>

      <!-- PANEL DE NAVEGACIÓN 3D INTERACTIVO -->
      <a-entity 
        id="interactive-marker"
        position="0 1.42 -0.15"
        animation="property: position; to: 0 1.46 -0.15; dir: alternate; dur: 1600; loop: true; easing: easeInOutSine">
        
        <!-- Cartel plano que actúa como collider interactivo -->
        <a-plane 
          id="marker-clickable-plane"
          class="interactable"
          studio-navigator
          width="1.3" 
          height="0.42" 
          color="#0f172a" 
          material="opacity: 0.95; transparent: true">
          
          <a-text 
            value="ENTRAR AL SECUENCIADOR" 
            align="center" 
            position="0 0.07 0.02" 
            scale="0.32 0.32 0.32" 
            color="#ffffff" 
            font="roboto">
          </a-text>
          
          <a-text 
            value="[ Tocar o apuntar para acceder al Nivel 4x4 ]" 
            align="center" 
            position="0 -0.07 0.02" 
            scale="0.2 0.2 0.2" 
            color="#94a3b8" 
            font="roboto">
          </a-text>
        </a-plane>

        <!-- Bordes sutiles del panel -->
        <a-box position="0 0.215 0.01" width="1.32" height="0.015" depth="0.01" color="#2b6cb0"></a-box>
        <a-box position="0 -0.215 0.01" width="1.32" height="0.015" depth="0.01" color="#2b6cb0"></a-box>
        
        <!-- Triángulo indicador -->
        <a-triangle 
          vertex-a="0 -0.32 0.02" 
          vertex-b="-0.08 -0.23 0.02" 
          vertex-c="0.08 -0.23 0.02" 
          material="color: #2b6cb0">
        </a-triangle>
      </a-entity>
    </a-entity>

    <!-- Sujeto Virtual: Cámara en primera persona y controles WebXR -->
    <a-entity id="rig" position="0 0 1.15">
      <a-camera 
        id="camera" 
        position="0 1.25 0"
        rotation="-12 0 0"
        look-controls="pointerLockEnabled: false" 
        wasd-controls="acceleration: 12">
        <!-- Raycaster de ratón y pantalla táctil -->
        <a-entity 
          id="mouse-raycaster"
          cursor="rayOrigin: mouse"
          raycaster="objects: .interactable; interval: 30">
        </a-entity>
      </a-camera>

      <!-- Controles WebXR para cascos de Realidad Virtual (Meta Quest, etc.) -->
      <a-entity laser-controls="hand: right" raycaster="objects: .interactable; interval: 30; lineColor: #38bdf8; lineOpacity: 0.8"></a-entity>
      <a-entity laser-controls="hand: left" raycaster="objects: .interactable; interval: 30; lineColor: #38bdf8; lineOpacity: 0.8"></a-entity>
    </a-entity>
  </a-scene>

  <!-- Lógica adicional de visibilidad de modelo 3D y listeners de respaldo -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const gltfNode = document.getElementById('drumpad-gltf-node');
      const fallbackNode = document.getElementById('drumpad-fallback');

      if (gltfNode && fallbackNode) {
        gltfNode.addEventListener('model-loaded', () => {
          gltfNode.setAttribute('visible', 'true');
          fallbackNode.setAttribute('visible', 'false');
        });

        gltfNode.addEventListener('model-error', () => {
          gltfNode.setAttribute('visible', 'false');
          fallbackNode.setAttribute('visible', 'true');
        });
      }

      // Respaldo de listener directo por si el framework raycaster dispara eventos DOM
      const targetEls = [
        document.getElementById('marker-clickable-plane'),
        document.getElementById('drumpad-hitbox')
      ];

      targetEls.forEach(el => {
        if (!el) return;
        el.addEventListener('click', (e) => {
          e.stopPropagation();
          window.location.href = 'escena-secuenciador.html';
        });
      });
    });
  </script>
</body>
</html>
