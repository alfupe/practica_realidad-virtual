<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DrumLab VR — Escena 1: Estudio de Producción (Nivel Explorativo)</title>
  
  <!-- Framework WebXR A-Frame 1.6.0 Oficial -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

  <!-- Componentes A-Frame registrados en <head> -->
  <script>
    AFRAME.registerComponent('maschine-studio-model', {
      init: function () {
        const applyFiltering = () => {
          const rootMesh = this.el.getObject3D('mesh');
          if (!rootMesh) return;
          const realMeshes = new Set(['Object_6', 'Object_8', 'Object_10', 'Object_12', 'Object_14']);
          rootMesh.traverse((child) => {
            if (child.isMesh) {
              if (!realMeshes.has(child.name)) {
                child.visible = false;
              } else {
                child.visible = true;
                if (child.material) {
                  child.material.side = THREE.DoubleSide;
                }
              }
            }
          });
          rootMesh.position.set(0, -3.835, 0.636);
        };

        if (this.el.getObject3D('mesh')) {
          applyFiltering();
        } else {
          this.el.addEventListener('model-loaded', applyFiltering);
        }
      }
    });

    AFRAME.registerComponent('daw-screen-ui', {
      init: function () {
        this.canvas = document.createElement('canvas');
        this.canvas.width = 1024;
        this.canvas.height = 560;
        this.ctx = this.canvas.getContext('2d');
        this.texture = new THREE.CanvasTexture(this.canvas);
        this.texture.anisotropy = 4;
        this.isHovered = false;

        this.applyTexture = () => {
          const mesh = this.el.getObject3D('mesh');
          if (!mesh) return;
          mesh.material = new THREE.MeshBasicMaterial({
            map: this.texture,
            side: THREE.DoubleSide
          });
          this.draw();
        };

        if (this.el.getObject3D('mesh')) {
          this.applyTexture();
        } else {
          this.el.addEventListener('object3dset', this.applyTexture);
        }

        this.el.addEventListener('mouseenter', () => {
          this.isHovered = true;
          this.draw();
        });
        this.el.addEventListener('mouseleave', () => {
          this.isHovered = false;
          this.draw();
        });
      },

      drawRoundedRect: function (ctx, x, y, w, h, r) {
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.arcTo(x + w, y, x + w, y + h, r);
        ctx.arcTo(x + w, y + h, x, y + h, r);
        ctx.arcTo(x, y + h, x, y, r);
        ctx.arcTo(x, y, x + w, y, r);
        ctx.closePath();
      },

      draw: function () {
        const ctx = this.ctx;
        const W = this.canvas.width;
        const H = this.canvas.height;

        // Fondo de interfaz DAW oscura de alta densidad
        const bgGrad = ctx.createLinearGradient(0, 0, 0, H);
        bgGrad.addColorStop(0, '#090e1a');
        bgGrad.addColorStop(1, '#050811');
        ctx.fillStyle = bgGrad;
        ctx.fillRect(0, 0, W, H);

        // Barra superior del DAW
        ctx.fillStyle = '#0f172a';
        ctx.fillRect(0, 0, W, 64);
        ctx.strokeStyle = '#1e293b';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(0, 64);
        ctx.lineTo(W, 64);
        ctx.stroke();

        // LED de estado y título del proyecto
        ctx.fillStyle = '#22c55e';
        ctx.beginPath();
        ctx.arc(36, 32, 6, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#f8fafc';
        ctx.font = 'bold 22px system-ui, -apple-system, sans-serif';
        ctx.textAlign = 'left';
        ctx.textBaseline = 'middle';
        ctx.fillText('DRUMLAB VR', 56, 32);

        ctx.fillStyle = '#64748b';
        ctx.font = '600 18px monospace';
        ctx.fillText('// STUDIO WORKSPACE', 208, 33);

        // Pastillas de telemetría a la derecha de la cabecera DAW
        ctx.textAlign = 'right';
        ctx.fillStyle = '#38bdf8';
        ctx.font = 'bold 18px monospace';
        ctx.fillText('120 BPM  ·  4/4  ·  4 BARS', W - 32, 32);

        // Pistas rítmicas visuales (vista previa estilizada de las 4 voces)
        const tracks = [
          { name: '01 CRASH',  color: '#f59e0b', hits: [1, 0, 0, 0, 0, 0, 0, 0] },
          { name: '02 HI-HAT', color: '#22c55e', hits: [1, 1, 1, 1, 1, 1, 1, 1] },
          { name: '03 SNARE',  color: '#38bdf8', hits: [0, 0, 1, 0, 0, 0, 1, 0] },
          { name: '04 KICK',   color: '#ec4899', hits: [1, 0, 0, 1, 1, 0, 0, 0] }
        ];

        const gridX = 44;
        const gridY = 98;
        const labelW = 148;
        const cellW = (W - 88 - labelW - 56) / 8;
        const rowH = 48;

        tracks.forEach((tr, rIdx) => {
          const y = gridY + rIdx * (rowH + 10);

          // Etiqueta de pista
          this.drawRoundedRect(ctx, gridX, y, labelW, rowH, 6);
          ctx.fillStyle = '#0f172a';
          ctx.fill();
          ctx.strokeStyle = '#1e293b';
          ctx.lineWidth = 1.5;
          ctx.stroke();

          ctx.fillStyle = tr.color;
          ctx.fillRect(gridX + 6, y + 10, 4, rowH - 20);

          ctx.fillStyle = '#cbd5e1';
          ctx.font = 'bold 16px monospace';
          ctx.textAlign = 'left';
          ctx.fillText(tr.name, gridX + 20, y + rowH / 2 + 1);

          // Celdas de pasos
          tr.hits.forEach((hit, cIdx) => {
            const cx = gridX + labelW + 14 + cIdx * (cellW + 6);
            this.drawRoundedRect(ctx, cx, y, cellW, rowH, 6);
            if (hit) {
              ctx.fillStyle = tr.color + '33';
              ctx.fill();
              ctx.strokeStyle = tr.color;
              ctx.lineWidth = 1.5;
              ctx.stroke();
            } else {
              ctx.fillStyle = '#0b1220';
              ctx.fill();
              ctx.strokeStyle = '#1e293b';
              ctx.lineWidth = 1;
              ctx.stroke();
            }
          });
        });

        // Botón principal integrado (hardware/DAW launch bar)
        const btnW = 540;
        const btnH = 86;
        const btnX = (W - btnW) / 2;
        const btnY = H - btnH - 42;

        this.drawRoundedRect(ctx, btnX, btnY, btnW, btnH, 12);
        const btnGrad = ctx.createLinearGradient(btnX, btnY, btnX + btnW, btnY + btnH);
        if (this.isHovered) {
          btnGrad.addColorStop(0, '#0284c7');
          btnGrad.addColorStop(1, '#0369a1');
        } else {
          btnGrad.addColorStop(0, '#0f172a');
          btnGrad.addColorStop(1, '#1e293b');
        }
        ctx.fillStyle = btnGrad;
        ctx.fill();

        ctx.strokeStyle = this.isHovered ? '#7dd3fc' : '#38bdf8';
        ctx.lineWidth = this.isHovered ? 3 : 2;
        ctx.stroke();

        // Texto principal del botón
        ctx.textAlign = 'center';
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 24px system-ui, -apple-system, sans-serif';
        ctx.fillText('ABRIR SECUENCIADOR 4×4  ›', W / 2, btnY + 33);

        ctx.fillStyle = this.isHovered ? '#e0f2fe' : '#94a3b8';
        ctx.font = '500 15px system-ui, -apple-system, sans-serif';
        ctx.fillText('Haz clic aquí o pulsa directamente sobre la Maschine MK3', W / 2, btnY + 61);

        this.texture.needsUpdate = true;
      }
    });

    AFRAME.registerComponent('studio-navigator', {
      schema: {
        targetUrl: { type: 'string', default: 'escena-secuenciador.html' }
      },

      init: function () {
        const el = this.el;
        const targetUrl = this.data.targetUrl;

        let isNavigating = false;
        this.navigate = (evt) => {
          if (evt && evt.stopPropagation) evt.stopPropagation();
          if (isNavigating) return;
          isNavigating = true;
          setTimeout(() => { isNavigating = false; }, 500);

          // Feedback sonoro sutil con Web Audio API
          try {
            const AudioCtxClass = window.AudioContext || window.webkitAudioContext;
            if (AudioCtxClass) {
              const ctx = new AudioCtxClass();
              const osc = ctx.createOscillator();
              const gain = ctx.createGain();
              osc.type = 'sine';
              osc.frequency.setValueAtTime(440, ctx.currentTime);
              osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.08);
              gain.gain.setValueAtTime(0.12, ctx.currentTime);
              gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.1);
              osc.connect(gain);
              gain.connect(ctx.destination);
              osc.start();
              osc.stop(ctx.currentTime + 0.1);
            }
          } catch (err) {}

          // Notificación al marco padre si está embebido en index.html
          if (window.parent && window.parent !== window) {
            try {
              if (typeof window.parent.cambiarEscena === 'function') {
                window.parent.cambiarEscena(2);
                return;
              }
            } catch (err) {}
            try {
              window.parent.postMessage({ action: 'cambiarEscena', escena: 2 }, '*');
            } catch (err) {}
            return;
          }

          window.location.href = targetUrl;
        };

        el.addEventListener('click', this.navigate);
        el.addEventListener('touchend', this.navigate);

        el.addEventListener('mouseenter', () => {
          document.body.style.cursor = 'pointer';
        });

        el.addEventListener('mouseleave', () => {
          document.body.style.cursor = 'default';
        });
      }
    });
  </script>

  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #1a1e24;
      font-family: Helvetica, Arial, sans-serif;
    }
    
    /* Barra superior HUD minimalista unificada */
    .hud-topbar {
      position: absolute;
      top: 12px;
      left: 12px;
      right: 12px;
      z-index: 100;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
    }
    .hud-topbar__group {
      display: flex;
      align-items: center;
      gap: 8px;
      pointer-events: auto;
    }
    .hud-badge-title {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 6px 12px;
      background: rgba(15, 23, 42, 0.88);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 6px;
      color: #f1f5f9;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.03em;
    }
    .hud-badge-title__dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #38bdf8;
      box-shadow: 0 0 8px #38bdf8;
    }
    .hud-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      background: rgba(15, 23, 42, 0.90);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(56, 189, 248, 0.35);
      border-radius: 6px;
      color: #38bdf8;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      font-family: inherit;
      transition: all 0.15s ease;
      text-decoration: none;
    }
    .hud-btn:hover, .hud-btn:focus-visible {
      background: rgba(30, 41, 59, 0.95);
      border-color: #38bdf8;
      color: #ffffff;
      box-shadow: 0 0 14px rgba(56, 189, 248, 0.4);
      outline: none;
    }
  </style>
</head>
<body>
  <!-- Barra superior HUD minimalista unificada -->
  <header class="hud-topbar" role="banner">
    <div class="hud-topbar__group">
      <span class="hud-badge-title">
        <span class="hud-badge-title__dot"></span>
        01 ESTUDIO DE PRODUCCIÓN
      </span>
    </div>
    <div class="hud-topbar__group">
      <button id="btnHudEnter" class="hud-btn" type="button" title="Entrar al Secuenciador 4x4 (Escena 2)">
        <span>Ir al Secuenciador 4×4</span> &rsaquo;
      </button>
    </div>
  </header>

  <a-scene 
    loading-screen="dotsColor: #38bdf8; backgroundColor: #111827"
    renderer="antialias: true; colorManagement: true"
    vr-mode-ui="enabled: true">
    
    <!-- Gestor de Assets -->
    <a-assets timeout="6000">
      <img id="studio-neon-pano" src="assets/textures/studio_neon_360.jpg">
      <a-asset-item id="drumpad-model" src="assets/models/maschine_native_instruments.glb"></a-asset-item>
    </a-assets>

    <!-- Entorno 360° Equirrectangular: Neon Photostudio (Sergej Majboroda / Poly Haven, CC0) -->
    <!-- Ambiente oscuro de estudio con pared acústica negra mate, neones LED y suelo de madera despejado -->
    <a-sky src="#studio-neon-pano" rotation="0 -90 0" color="#d4d4d8"></a-sky>

    <!-- Iluminación del estudio equilibrada para entorno oscuro profesional -->
    <a-light type="ambient" color="#cbd5e1" intensity="1.05"></a-light>
    <a-light type="directional" color="#ffffff" intensity="1.35" position="2 4 2" target="#desk"></a-light>
    <a-light type="point" color="#93c5fd" intensity="0.7" distance="5" position="0 2.0 -0.2"></a-light>

    <!-- Mesa Central de Trabajo (Estilo Consola de Estudio Profesional) -->
    <!-- Apoyada sólidamente sobre el suelo de madera -->
    <a-entity id="desk" position="0 0.02 -0.05">
      <!-- Tablero Principal en grafito satinado -->
      <a-box position="0 0.88 -0.2" width="2.4" height="0.08" depth="1.2" color="#18181b" roughness="0.4" metalness="0.2"></a-box>
      <!-- Patas de soporte -->
      <a-cylinder position="-1.05 0.44 0.25" radius="0.035" height="0.88" color="#09090b" metalness="0.8"></a-cylinder>
      <a-cylinder position="1.05 0.44 0.25" radius="0.035" height="0.88" color="#09090b" metalness="0.8"></a-cylinder>
      <a-cylinder position="-1.05 0.44 -0.65" radius="0.035" height="0.88" color="#09090b" metalness="0.8"></a-cylinder>
      <a-cylinder position="1.05 0.44 -0.65" radius="0.035" height="0.88" color="#09090b" metalness="0.8"></a-cylinder>

      <!-- Monitores de Audio (Altavoces de campo cercano) -->
      <a-entity position="-0.95 1.15 -0.45" rotation="0 25 0">
        <a-box width="0.25" height="0.42" depth="0.28" color="#18181b" roughness="0.5"></a-box>
        <a-cylinder position="0 -0.06 0.14" rotation="90 0 0" radius="0.08" height="0.02" color="#3f3f46"></a-cylinder>
        <a-cylinder position="0 0.11 0.14" rotation="90 0 0" radius="0.035" height="0.02" color="#71717a"></a-cylinder>
      </a-entity>

      <a-entity position="0.95 1.15 -0.45" rotation="0 -25 0">
        <a-box width="0.25" height="0.42" depth="0.28" color="#18181b" roughness="0.5"></a-box>
        <a-cylinder position="0 -0.06 0.14" rotation="90 0 0" radius="0.08" height="0.02" color="#3f3f46"></a-cylinder>
        <a-cylinder position="0 0.11 0.14" rotation="90 0 0" radius="0.035" height="0.02" color="#71717a"></a-cylinder>
      </a-entity>

      <!-- Pantalla / Monitor Frontal del DAW (Interfaz HiDPI CanvasTexture) -->
      <a-entity position="0 1.35 -0.65">
        <!-- Chasis y bisel del monitor -->
        <a-box width="1.16" height="0.66" depth="0.04" color="#09090b" roughness="0.5" metalness="0.5"></a-box>
        
        <!-- Pantalla interactiva DAW renderizada en Canvas HiDPI 1024x560 -->
        <a-plane 
          id="daw-screen"
          class="interactable"
          studio-navigator
          daw-screen-ui
          position="0 0 0.025" 
          width="1.10" 
          height="0.60">
        </a-plane>

        <!-- Soporte ergonómico del monitor -->
        <a-box position="0 -0.34 0" width="0.08" height="0.18" depth="0.06" color="#27272a" roughness="0.5" metalness="0.6"></a-box>
        <a-box position="0 -0.42 0.05" width="0.32" height="0.02" depth="0.22" color="#27272a" roughness="0.5" metalness="0.6"></a-box>
      </a-entity>

      <!-- ================================================================
           MODELO 3D OFICIAL: Maschine Native Instruments (jmccopus, CC BY 4.0)
           Orientado hacia el usuario sobre la mesa de trabajo
           ================================================================ -->
      <a-entity 
        id="studio-drumpad"
        position="0 0.99 -0.15"
        rotation="-72 0 0"
        scale="0.16 0.16 0.16">
        
        <!-- Modelo 3D GLTF oficial -->
        <a-gltf-model 
          id="drumpad-gltf-node"
          maschine-studio-model
          src="#drumpad-model">
        </a-gltf-model>

        <!-- Hitbox interactiva que cubre el drum pad para selección directa -->
        <a-box 
          id="drumpad-hitbox"
          class="interactable"
          studio-navigator
          position="0 0 0" 
          width="4.8" 
          height="3.2" 
          depth="0.8" 
          material="opacity: 0; transparent: true">
        </a-box>
      </a-entity>
    </a-entity>

    <!-- Sujeto Virtual: Cámara ergonómica estable y controles WebXR -->
    <!-- wasd-controls desactivado para no interferir con las teclas del teclado ni salir volando -->
    <a-entity id="rig" position="0 0 1.35" rotation="-16 0 0">
      <a-camera 
        id="camera" 
        position="0 1.35 0"
        look-controls="pointerLockEnabled: false" 
        wasd-controls="enabled: false">
        <!-- Raycaster de ratón y pantalla táctil -->
        <a-entity 
          id="mouse-raycaster"
          cursor="rayOrigin: mouse"
          raycaster="objects: .interactable; interval: 30">
        </a-entity>
      </a-camera>

      <!-- Controles WebXR para cascos de Realidad Virtual -->
      <a-entity laser-controls="hand: right" raycaster="objects: .interactable; interval: 30; lineColor: #38bdf8; lineOpacity: 0.8"></a-entity>
      <a-entity laser-controls="hand: left" raycaster="objects: .interactable; interval: 30; lineColor: #38bdf8; lineOpacity: 0.8"></a-entity>
    </a-entity>
  </a-scene>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const sceneEl = document.querySelector('a-scene');
      const raycaster = new THREE.Raycaster();
      const pointer = new THREE.Vector2();

      let isNavigating = false;
      const triggerNavigation = () => {
        if (isNavigating) return;
        isNavigating = true;
        setTimeout(() => { isNavigating = false; }, 500);

        const navEl = document.querySelector('[studio-navigator]');
        if (navEl && navEl.components && navEl.components['studio-navigator']) {
          navEl.components['studio-navigator'].navigate();
        } else {
          if (window.parent && window.parent !== window) {
            try {
              if (typeof window.parent.cambiarEscena === 'function') {
                window.parent.cambiarEscena(2);
                return;
              }
            } catch (err) {}
            try {
              window.parent.postMessage({ action: 'cambiarEscena', escena: 2 }, '*');
            } catch (err) {}
            return;
          }
          window.location.href = 'escena-secuenciador.html';
        }
      };

      const btnHudEnter = document.getElementById('btnHudEnter');
      if (btnHudEnter) {
        btnHudEnter.addEventListener('click', (e) => {
          e.stopPropagation();
          triggerNavigation();
        });
      }

      // Registro de inicio de interacción de puntero para distinguir clics de arrastres
      let pointerDownPos = null;

      window.addEventListener('pointerdown', (e) => {
        pointerDownPos = { x: e.clientX, y: e.clientY, time: Date.now() };
      }, { passive: true });

      // Disparo de navegación 3D únicamente en pointerup (clic completado sin arrastre de cámara)
      window.addEventListener('pointerup', (e) => {
        if (!pointerDownPos) return;
        const dx = e.clientX - pointerDownPos.x;
        const dy = e.clientY - pointerDownPos.y;
        const dt = Date.now() - pointerDownPos.time;
        pointerDownPos = null;

        // Si el usuario arrastró el ratón para rotar la cámara o mantuvo pulsado más de 600ms, no es un clic
        if (Math.hypot(dx, dy) > 8 || dt > 600) return;

        // Si se pulsó sobre la barra superior HTML, el evento click nativo lo gestiona
        if (e.target && e.target.closest && e.target.closest('.hud-topbar')) return;

        if (!sceneEl || !sceneEl.camera) return;
        const canvas = sceneEl.canvas || document.querySelector('canvas');
        if (!canvas) return;
        const rect = canvas.getBoundingClientRect();
        pointer.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
        pointer.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;

        if (sceneEl.object3D) sceneEl.object3D.updateMatrixWorld(true);
        raycaster.setFromCamera(pointer, sceneEl.camera);

        const interactables = [];
        const dawScreen = document.getElementById('daw-screen');
        const dawBtn = document.getElementById('daw-screen-btn');
        const hitbox = document.getElementById('drumpad-hitbox');
        if (dawScreen && dawScreen.object3D) interactables.push(dawScreen.object3D);
        if (dawBtn && dawBtn.object3D) interactables.push(dawBtn.object3D);
        if (hitbox && hitbox.object3D) interactables.push(hitbox.object3D);

        const hits = raycaster.intersectObjects(interactables, true);
        if (hits.length > 0) {
          triggerNavigation();
        }
      });

      window.addEventListener('pointermove', (e) => {
        if (!sceneEl || !sceneEl.camera) return;
        const canvas = sceneEl.canvas || document.querySelector('canvas');
        if (!canvas) return;
        const rect = canvas.getBoundingClientRect();
        pointer.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
        pointer.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;

        if (sceneEl.object3D) sceneEl.object3D.updateMatrixWorld(true);
        raycaster.setFromCamera(pointer, sceneEl.camera);

        const interactables = [];
        const dawScreen = document.getElementById('daw-screen');
        const dawBtn = document.getElementById('daw-screen-btn');
        const hitbox = document.getElementById('drumpad-hitbox');
        if (dawScreen && dawScreen.object3D) interactables.push(dawScreen.object3D);
        if (dawBtn && dawBtn.object3D) interactables.push(dawBtn.object3D);
        if (hitbox && hitbox.object3D) interactables.push(hitbox.object3D);

        const hits = raycaster.intersectObjects(interactables, true);
        document.body.style.cursor = (hits.length > 0) ? 'pointer' : 'default';
      }, { passive: true });
    });
  </script>
</body>
</html>
