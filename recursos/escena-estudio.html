<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DrumLab VR — Escena 1: Estudio de Producción (Nivel Explorativo)</title>
  
  <!-- Framework WebXR A-Frame 1.6.0 Oficial -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>

  <!-- Componentes A-Frame registrados en <head> -->
  <script>
    AFRAME.registerComponent('studio-navigator', {
      schema: {
        targetUrl: { type: 'string', default: 'escena-secuenciador.html' }
      },

      init: function () {
        const el = this.el;
        const targetUrl = this.data.targetUrl;

        const navigate = (evt) => {
          if (evt) evt.stopPropagation();

          // Feedback sonoro sutil con Web Audio API
          try {
            const AudioCtxClass = window.AudioContext || window.webkitAudioContext;
            if (AudioCtxClass) {
              const ctx = new AudioCtxClass();
              const osc = ctx.createOscillator();
              const gain = ctx.createGain();
              osc.type = 'sine';
              osc.frequency.setValueAtTime(440, ctx.currentTime);
              osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.08);
              gain.gain.setValueAtTime(0.12, ctx.currentTime);
              gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.1);
              osc.connect(gain);
              gain.connect(ctx.destination);
              osc.start();
              osc.stop(ctx.currentTime + 0.1);
            }
          } catch (err) {}

          window.location.href = targetUrl;
        };

        el.addEventListener('click', navigate);
        el.addEventListener('touchend', navigate);

        el.addEventListener('mouseenter', () => {
          document.body.style.cursor = 'pointer';
        });

        el.addEventListener('mouseleave', () => {
          document.body.style.cursor = 'default';
        });
      }
    });
  </script>

  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #1a1e24;
      font-family: Helvetica, Arial, sans-serif;
    }
    
    .hud-overlay {
      position: absolute;
      top: 12px;
      left: 12px;
      z-index: 100;
      color: #f1f5f9;
      background: rgba(15, 23, 42, 0.85);
      padding: 8px 14px;
      border-radius: 4px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      font-size: 13px;
      pointer-events: none;
      line-height: 1.4;
    }
    .hud-overlay strong {
      color: #38bdf8;
    }
  </style>
</head>
<body>
  <!-- HUD superpuesto -->
  <div class="hud-overlay">
    <strong>Escena 1: Estudio de Producción</strong><br>
    Toca o apunta al controlador Drum Pad o al panel de acceso para entrar al secuenciador.
  </div>

  <a-scene 
    loading-screen="dotsColor: #38bdf8; backgroundColor: #111827"
    renderer="antialias: true; colorManagement: true"
    vr-mode-ui="enabled: true">
    
    <!-- Gestor de Assets -->
    <a-assets timeout="6000">
      <a-asset-item id="drumpad-model" src="assets/models/oversized_drum_pad.glb"></a-asset-item>
    </a-assets>

    <!-- Iluminación del estudio -->
    <a-light type="ambient" color="#cbd5e1" intensity="1.2"></a-light>
    <a-light type="directional" color="#ffffff" intensity="1.6" position="2 5 3" target="#desk"></a-light>
    <a-light type="point" color="#93c5fd" intensity="1.2" distance="6" position="0 2.2 -0.2"></a-light>

    <!-- Fondo / Entorno -->
    <a-sky color="#0f172a"></a-sky>

    <!-- Suelo -->
    <a-plane 
      position="0 0 0" 
      rotation="-90 0 0" 
      width="20" 
      height="20" 
      color="#1e293b" 
      roughness="0.6" 
      metalness="0.2">
    </a-plane>

    <!-- Paredes del estudio -->
    <a-plane position="0 4 -5" width="16" height="8" color="#1e293b" roughness="0.8"></a-plane>
    <a-plane position="-8 4 0" rotation="0 90 0" width="16" height="8" color="#1e293b" roughness="0.8"></a-plane>
    <a-plane position="8 4 0" rotation="0 -90 0" width="16" height="8" color="#1e293b" roughness="0.8"></a-plane>

    <!-- Paneles acústicos diffusers -->
    <a-entity id="acoustic-panels" position="0 2.6 -4.85">
      <a-box position="-3 0 0" width="0.8" height="3" depth="0.15" color="#334155"></a-box>
      <a-box position="-1.5 0 0" width="0.8" height="3" depth="0.15" color="#243044"></a-box>
      <a-box position="0 0 0" width="1.2" height="3" depth="0.15" color="#334155"></a-box>
      <a-box position="1.5 0 0" width="0.8" height="3" depth="0.15" color="#243044"></a-box>
      <a-box position="3 0 0" width="0.8" height="3" depth="0.15" color="#334155"></a-box>
      <a-box position="0 1.8 0.05" width="7.4" height="0.04" depth="0.04" color="#475569"></a-box>
    </a-entity>

    <!-- Mesa Central de Trabajo -->
    <a-entity id="desk" position="0 0 0">
      <!-- Tablero Principal -->
      <a-box position="0 0.88 -0.2" width="2.4" height="0.08" depth="1.2" color="#1a202c" roughness="0.5" metalness="0.3"></a-box>
      <!-- Patas -->
      <a-cylinder position="-1.05 0.44 0.25" radius="0.035" height="0.88" color="#0f172a" metalness="0.7"></a-cylinder>
      <a-cylinder position="1.05 0.44 0.25" radius="0.035" height="0.88" color="#0f172a" metalness="0.7"></a-cylinder>
      <a-cylinder position="-1.05 0.44 -0.65" radius="0.035" height="0.88" color="#0f172a" metalness="0.7"></a-cylinder>
      <a-cylinder position="1.05 0.44 -0.65" radius="0.035" height="0.88" color="#0f172a" metalness="0.7"></a-cylinder>

      <!-- Monitores de Audio (Altavoces) -->
      <a-entity position="-0.95 1.15 -0.45" rotation="0 25 0">
        <a-box width="0.25" height="0.42" depth="0.28" color="#111827" roughness="0.6"></a-box>
        <a-cylinder position="0 -0.06 0.14" rotation="90 0 0" radius="0.08" height="0.02" color="#334155"></a-cylinder>
        <a-cylinder position="0 0.11 0.14" rotation="90 0 0" radius="0.035" height="0.02" color="#64748b"></a-cylinder>
      </a-entity>

      <a-entity position="0.95 1.15 -0.45" rotation="0 -25 0">
        <a-box width="0.25" height="0.42" depth="0.28" color="#111827" roughness="0.6"></a-box>
        <a-cylinder position="0 -0.06 0.14" rotation="90 0 0" radius="0.08" height="0.02" color="#334155"></a-cylinder>
        <a-cylinder position="0 0.11 0.14" rotation="90 0 0" radius="0.035" height="0.02" color="#64748b"></a-cylinder>
      </a-entity>

      <!-- Pantalla / Monitor Frontal del DAW -->
      <a-entity position="0 1.35 -0.65">
        <a-box width="1.1" height="0.6" depth="0.04" color="#0f172a"></a-box>
        <a-plane position="0 0 0.025" width="1.04" height="0.54" color="#1e293b"></a-plane>
        <a-text value="DRUMLAB VR // ESTUDIO DE PRODUCCION" align="center" position="0 0.12 0.03" scale="0.24 0.24 0.24" color="#38bdf8"></a-text>
        <a-text value="WebXR Spatial Audio Workspace 4/4" align="center" position="0 -0.05 0.03" scale="0.18 0.18 0.18" color="#94a3b8"></a-text>
        <!-- Soporte pantalla -->
        <a-box position="0 -0.32 0" width="0.08" height="0.2" depth="0.06" color="#334155"></a-box>
        <a-box position="0 -0.4 0.05" width="0.3" height="0.02" depth="0.2" color="#334155"></a-box>
      </a-entity>

      <!-- ================================================================
           MODELO 3D OFICIAL: Oversized Drum Pad (lukus1, CC BY 4.0)
           Orientado hacia el usuario (rotation="0 -90 0") sobre la mesa
           ================================================================ -->
      <a-entity 
        id="studio-drumpad"
        position="0 0.93 -0.1"
        rotation="-10 0 0">
        
        <!-- Modelo 3D GLTF oficial cargado directamente sin fallbacks artificiales -->
        <a-gltf-model 
          id="drumpad-gltf-node"
          src="#drumpad-model" 
          position="0 0 0"
          rotation="0 -90 0"
          scale="0.42 0.42 0.42">
        </a-gltf-model>

        <!-- Hitbox interactiva que cubre el drum pad para clic y selección directa -->
        <a-box 
          id="drumpad-hitbox"
          class="interactable"
          studio-navigator
          position="0 0.04 0" 
          width="0.95" 
          height="0.12" 
          depth="0.85" 
          material="opacity: 0; transparent: true">
        </a-box>
      </a-entity>

      <!-- Panel de navegación flotante situado sutilmente sobre el monitor (sin tapar el pad) -->
      <a-entity 
        id="interactive-marker"
        position="0 1.8 -0.6"
        animation="property: position; to: 0 1.84 -0.6; dir: alternate; dur: 1800; loop: true; easing: easeInOutSine">
        
        <a-plane 
          id="marker-clickable-plane"
          class="interactable"
          studio-navigator
          width="1.3" 
          height="0.32" 
          color="#0f172a" 
          material="opacity: 0.95; transparent: true">
          
          <a-text 
            value="ENTRAR AL SECUENCIADOR 4x4" 
            align="center" 
            position="0 0.05 0.02" 
            scale="0.28 0.28 0.28" 
            color="#ffffff" 
            font="roboto">
          </a-text>
          
          <a-text 
            value="[ Tocar o apuntar para abrir el Secuenciador ]" 
            align="center" 
            position="0 -0.06 0.02" 
            scale="0.18 0.18 0.18" 
            color="#94a3b8" 
            font="roboto">
          </a-text>
        </a-plane>

        <a-box position="0 0.165 0.01" width="1.32" height="0.012" depth="0.01" color="#2b6cb0"></a-box>
        <a-box position="0 -0.165 0.01" width="1.32" height="0.012" depth="0.01" color="#2b6cb0"></a-box>
      </a-entity>
    </a-entity>

    <!-- Sujeto Virtual: Cámara ergonómica estable y controles WebXR -->
    <!-- wasd-controls desactivado para no interferir con las teclas del teclado ni salir volando -->
    <a-entity id="rig" position="0 0 1.05">
      <a-camera 
        id="camera" 
        position="0 1.25 0"
        rotation="-10 0 0"
        look-controls="pointerLockEnabled: false" 
        wasd-controls="enabled: false">
        <!-- Raycaster de ratón y pantalla táctil -->
        <a-entity 
          id="mouse-raycaster"
          cursor="rayOrigin: mouse"
          raycaster="objects: .interactable; interval: 30">
        </a-entity>
      </a-camera>

      <!-- Controles WebXR para cascos de Realidad Virtual -->
      <a-entity laser-controls="hand: right" raycaster="objects: .interactable; interval: 30; lineColor: #38bdf8; lineOpacity: 0.8"></a-entity>
      <a-entity laser-controls="hand: left" raycaster="objects: .interactable; interval: 30; lineColor: #38bdf8; lineOpacity: 0.8"></a-entity>
    </a-entity>
  </a-scene>
</body>
</html>
