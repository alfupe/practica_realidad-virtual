<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DrumLab VR — Escena 2: Secuenciador 4x4 (Plano Operativo)</title>
  
  <!-- Framework WebXR A-Frame 1.6.0 Oficial -->
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  
  <!-- Módulos de Sonido y Lógica de Componentes -->
  <script src="js/drum-pad.js"></script>
  <script src="js/step-sequencer.js"></script>
  
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #1a1e24;
      font-family: Helvetica, Arial, sans-serif;
    }
    /* HUD overlay superior con feedback contextual */
    .hud-sequencer {
      position: absolute;
      top: 12px;
      left: 12px;
      z-index: 100;
      color: #f1f5f9;
      background: rgba(15, 23, 42, 0.85);
      padding: 8px 14px;
      border-radius: 4px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      font-size: 13px;
      line-height: 1.45;
      pointer-events: none;
    }
    .hud-sequencer strong {
      color: #38bdf8;
    }
    .hud-badge {
      display: inline-block;
      background: #334155;
      padding: 1px 5px;
      border-radius: 3px;
      font-family: monospace;
      font-size: 11px;
      color: #f8fafc;
      margin-top: 2px;
    }
  </style>
</head>
<body>
  <!-- HUD 2D informativo multimodal -->
  <div class="hud-sequencer">
    <strong>Escena 2: Secuenciador 4&times;4 Operativo</strong><br>
    Toca o apunta a los pads para programar pasos. Pulsa <span class="hud-badge">Espacio</span> para Play/Stop.<br>
    Teclado isomórfico activo: <span class="hud-badge">1-4</span> Crash · <span class="hud-badge">Q-R</span> Hi-Hat · <span class="hud-badge">A-F</span> Snare · <span class="hud-badge">Z-V</span> Kick
  </div>

  <a-scene 
    loading-screen="dotsColor: #38bdf8; backgroundColor: #111827"
    renderer="antialias: true; colorManagement: true"
    vr-mode-ui="enabled: true">

    <a-assets timeout="6000">
      <!-- Modelo 3D Oficial Oversized Drum Pad (lukus1, CC BY 4.0) -->
      <a-asset-item id="drumpad-model" src="assets/models/oversized_drum_pad.glb"></a-asset-item>
    </a-assets>

    <!-- Iluminación directa y equilibrada sobre el controlador -->
    <a-light type="ambient" color="#cbd5e1" intensity="1.4"></a-light>
    <a-light type="directional" color="#ffffff" intensity="1.7" position="0 5 2" target="#drumpad-controller"></a-light>
    <a-light type="point" color="#93c5fd" intensity="1.2" distance="6" position="0 2.2 0"></a-light>

    <!-- Atmósfera de fondo -->
    <a-sky color="#0f172a"></a-sky>

    <!-- Suelo reflectante -->
    <a-plane 
      position="0 0 0" 
      rotation="-90 0 0" 
      width="16" 
      height="16" 
      color="#1e293b" 
      roughness="0.6" 
      metalness="0.2">
    </a-plane>

    <!-- Mesa Soporte del Controlador -->
    <a-box 
      position="0 0.44 0" 
      width="1.8" 
      height="0.88" 
      depth="1.4" 
      color="#1e2229" 
      roughness="0.6">
    </a-box>

    <!-- ====================================================================
         CONTROLADOR OVERSIZED DRUM PAD (MODELO 3D REAL + PADS INTERACTIVOS)
         ==================================================================== -->
    <a-entity 
      id="drumpad-controller" 
      position="0 0.9 0" 
      rotation="-12 0 0"
      step-sequencer="bpm: 120; isPlaying: false; tempoLedsSelector: .tempo-led">

      <!-- MODELO 3D GLTF REAL (lukus1, CC BY 4.0) -->
      <a-gltf-model 
        id="gltf-controller"
        src="#drumpad-model" 
        position="0 0 0" 
        rotation="0 -90 0" 
        scale="0.55 0.55 0.55">
      </a-gltf-model>

      <!-- ==================================================================
           BOTONES DE TRANSPORTE 3D (PLAY/STOP, BPM, CLEAR)
           ================================================================== -->
      <a-entity id="transport-controls" position="0 0.055 -0.44">
        <!-- Botón Play/Stop -->
        <a-box 
          id="btn-play-stop" 
          class="interactable" 
          position="-0.26 0 0" 
          width="0.18" 
          height="0.03" 
          depth="0.075" 
          material="color: #059669; roughness: 0.3">
          <a-text 
            id="text-play-val" 
            value="PLAY" 
            align="center" 
            position="0 0.018 0" 
            rotation="-90 0 0" 
            scale="0.22 0.22 0.22" 
            color="#ffffff">
          </a-text>
        </a-box>

        <!-- Selector de BPM (90 / 120 / 140) -->
        <a-box 
          id="btn-bpm" 
          class="interactable" 
          position="0 0 0" 
          width="0.22" 
          height="0.03" 
          depth="0.075" 
          material="color: #0284c7; roughness: 0.4">
          <a-text 
            id="text-bpm-val" 
            value="120 BPM" 
            align="center" 
            position="0 0.018 0" 
            rotation="-90 0 0" 
            scale="0.2 0.2 0.2" 
            color="#ffffff">
          </a-text>
        </a-box>

        <!-- Botón Clear (Borrar Patrón) -->
        <a-box 
          id="btn-clear" 
          class="interactable" 
          position="0.26 0 0" 
          width="0.18" 
          height="0.03" 
          depth="0.075" 
          material="color: #b91c1c; roughness: 0.4">
          <a-text 
            value="CLEAR" 
            align="center" 
            position="0 0.018 0" 
            rotation="-90 0 0" 
            scale="0.2 0.2 0.2" 
            color="#ffffff">
          </a-text>
        </a-box>
      </a-entity>

      <!-- ==================================================================
           LEDS DE TEMPO (INDICADOR DE CABEZAL DE REPRODUCCIÓN EN TIEMPO REAL)
           ================================================================== -->
      <a-entity id="tempo-header" position="-0.02 0.055 -0.35">
        <a-entity position="-0.32 0 0">
          <a-cylinder class="tempo-led" data-col="0" radius="0.018" height="0.012" material="color: #334155; emissive: #000000; emissiveIntensity: 0"></a-cylinder>
          <a-text value="T1" align="center" position="0 0.01 -0.025" rotation="-90 0 0" scale="0.15 0.15 0.15" color="#94a3b8"></a-text>
        </a-entity>
        <a-entity position="-0.11 0 0">
          <a-cylinder class="tempo-led" data-col="1" radius="0.018" height="0.012" material="color: #334155; emissive: #000000; emissiveIntensity: 0"></a-cylinder>
          <a-text value="T2" align="center" position="0 0.01 -0.025" rotation="-90 0 0" scale="0.15 0.15 0.15" color="#94a3b8"></a-text>
        </a-entity>
        <a-entity position="0.10 0 0">
          <a-cylinder class="tempo-led" data-col="2" radius="0.018" height="0.012" material="color: #334155; emissive: #000000; emissiveIntensity: 0"></a-cylinder>
          <a-text value="T3" align="center" position="0 0.01 -0.025" rotation="-90 0 0" scale="0.15 0.15 0.15" color="#94a3b8"></a-text>
        </a-entity>
        <a-entity position="0.31 0 0">
          <a-cylinder class="tempo-led" data-col="3" radius="0.018" height="0.012" material="color: #334155; emissive: #000000; emissiveIntensity: 0"></a-cylinder>
          <a-text value="T4" align="center" position="0 0.01 -0.025" rotation="-90 0 0" scale="0.15 0.15 0.15" color="#94a3b8"></a-text>
        </a-entity>
      </a-entity>

      <!-- ==================================================================
           ETIQUETAS DE FILAS / VOCES TÍMBRICAS (LATERAL IZQUIERDO)
           ================================================================== -->
      <a-entity id="row-labels" position="-0.54 0.055 0">
        <a-text value="CRASH [1-4]" position="0 0 -0.23" rotation="-90 0 0" scale="0.16 0.16 0.16" color="#d97706"></a-text>
        <a-text value="HI-HAT [Q-R]" position="0 0 -0.05" rotation="-90 0 0" scale="0.16 0.16 0.16" color="#059669"></a-text>
        <a-text value="SNARE [A-F]" position="0 0 0.13" rotation="-90 0 0" scale="0.16 0.16 0.16" color="#0284c7"></a-text>
        <a-text value="KICK [Z-V]" position="0 0 0.31" rotation="-90 0 0" scale="0.16 0.16 0.16" color="#db2777"></a-text>
      </a-entity>

      <!-- ==================================================================
           MATRIZ DE 16 PADS INTERACTIVOS (ALINEADOS SOBRE EL MODELO 3D GLB)
           ================================================================== -->
      <a-entity id="matrix-pads" position="-0.02 0.055 0">

        <!-- FILA 0: PLATO CRASH (Ámbar) — Z = -0.23 -->
        <a-box id="pad-0" class="interactable pad" drum-pad="row: 0; col: 0; voice: crash; defaultColor: #1e293b; activeColor: #d97706; flashColor: #ffffff"
               position="-0.32 0 -0.23" width="0.16" height="0.016" depth="0.14" material="color: #1e293b; roughness: 0.5"></a-box>
        <a-box id="pad-1" class="interactable pad" drum-pad="row: 0; col: 1; voice: crash; defaultColor: #1e293b; activeColor: #d97706; flashColor: #ffffff"
               position="-0.11 0 -0.23" width="0.16" height="0.016" depth="0.14" material="color: #1e293b; roughness: 0.5"></a-box>
        <a-box id="pad-2" class="interactable pad" drum-pad="row: 0; col: 2; voice: crash; defaultColor: #1e293b; activeColor: #d97706; flashColor: #ffffff"
               position="0.10 0 -0.23" width="0.16" height="0.016" depth="0.14" material="color: #1e293b; roughness: 0.5"></a-box>
        <a-box id="pad-3" class="interactable pad" drum-pad="row: 0; col: 3; voice: crash; defaultColor: #1e293b; activeColor: #d97706; flashColor: #ffffff"
               position="0.31 0 -0.23" width="0.16" height="0.016" depth="0.14" material="color: #1e293b; roughness: 0.5"></a-box>

        <!-- FILA 1: CHARLES / HI-HAT (Esmeralda) — Z = -0.05 -->
        <a-box id="pad-4" class="interactable pad" drum-pad="row: 1; col: 0; voice: hihat; defaultColor: #1e293b; activeColor: #059669; flashColor: #ffffff"
               position="-0.32 0 -0.05" width="0.16" height="0.016" depth="0.14" material="color: #1e293b; roughness: 0.5"></a-box>
        <a-box id="pad-5" class="interactable pad" drum-pad="row: 1; col: 1; voice: hihat; defaultColor: #1e293b; activeColor: #059669; flashColor: #ffffff"
               position="-0.11 0 -0.05" width="0.16" height="0.016" depth="0.14" material="color: #1e293b; roughness: 0.5"></a-box>
        <a-box id="pad-6" class="interactable pad" drum-pad="row: 1; col: 2; voice: hihat; defaultColor: #1e293b; activeColor: #059669; flashColor: #ffffff"
               position="0.10 0 -0.05" width="0.16" height="0.016" depth="0.14" material="color: #1e293b; roughness: 0.5"></a-box>
        <a-box id="pad-7" class="interactable pad" drum-pad="row: 1; col: 3; voice: hihat; defaultColor: #1e293b; activeColor: #059669; flashColor: #ffffff"
               position="0.31 0 -0.05" width="0.16" height="0.016" depth="0.14" material="color: #1e293b; roughness: 0.5"></a-box>

        <!-- FILA 2: CAJA / SNARE (Azul cobalto) — Z = 0.13 -->
        <a-box id="pad-8" class="interactable pad" drum-pad="row: 2; col: 0; voice: snare; defaultColor: #1e293b; activeColor: #0284c7; flashColor: #ffffff"
               position="-0.32 0 0.13" width="0.16" height="0.016" depth="0.14" material="color: #1e293b; roughness: 0.5"></a-box>
        <a-box id="pad-9" class="interactable pad" drum-pad="row: 2; col: 1; voice: snare; defaultColor: #1e293b; activeColor: #0284c7; flashColor: #ffffff"
               position="-0.11 0 0.13" width="0.16" height="0.016" depth="0.14" material="color: #1e293b; roughness: 0.5"></a-box>
        <a-box id="pad-10" class="interactable pad" drum-pad="row: 2; col: 2; voice: snare; defaultColor: #1e293b; activeColor: #0284c7; flashColor: #ffffff"
               position="0.10 0 0.13" width="0.16" height="0.016" depth="0.14" material="color: #1e293b; roughness: 0.5"></a-box>
        <a-box id="pad-11" class="interactable pad" drum-pad="row: 2; col: 3; voice: snare; defaultColor: #1e293b; activeColor: #0284c7; flashColor: #ffffff"
               position="0.31 0 0.13" width="0.16" height="0.016" depth="0.14" material="color: #1e293b; roughness: 0.5"></a-box>

        <!-- FILA 3: BOMBO / KICK (Magenta / Rosa) — Z = 0.31 -->
        <a-box id="pad-12" class="interactable pad" drum-pad="row: 3; col: 0; voice: kick; defaultColor: #1e293b; activeColor: #db2777; flashColor: #ffffff"
               position="-0.32 0 0.31" width="0.16" height="0.016" depth="0.14" material="color: #1e293b; roughness: 0.5"></a-box>
        <a-box id="pad-13" class="interactable pad" drum-pad="row: 3; col: 1; voice: kick; defaultColor: #1e293b; activeColor: #db2777; flashColor: #ffffff"
               position="-0.11 0 0.31" width="0.16" height="0.016" depth="0.14" material="color: #1e293b; roughness: 0.5"></a-box>
        <a-box id="pad-14" class="interactable pad" drum-pad="row: 3; col: 2; voice: kick; defaultColor: #1e293b; activeColor: #db2777; flashColor: #ffffff"
               position="0.10 0 0.31" width="0.16" height="0.016" depth="0.14" material="color: #1e293b; roughness: 0.5"></a-box>
        <a-box id="pad-15" class="interactable pad" drum-pad="row: 3; col: 3; voice: kick; defaultColor: #1e293b; activeColor: #db2777; flashColor: #ffffff"
               position="0.31 0 0.31" width="0.16" height="0.016" depth="0.14" material="color: #1e293b; roughness: 0.5"></a-box>
      </a-entity>
    </a-entity>

    <!-- ====================================================================
         BOTÓN 3D: VOLVER AL ESTUDIO (ACCESIBLE Y CLARO)
         ==================================================================== -->
    <a-entity 
      id="btn-back-studio" 
      class="interactable" 
      position="-0.85 1.15 -0.2" 
      rotation="0 25 0">
      
      <a-box 
        width="0.38" 
        height="0.1" 
        depth="0.04" 
        color="#0f172a">
        <a-text 
          value="< VOLVER AL ESTUDIO" 
          align="center" 
          position="0 0 0.025" 
          scale="0.2 0.2 0.2" 
          color="#f8fafc">
        </a-text>
      </a-box>
    </a-entity>

    <!-- ====================================================================
         CÁMARA: ERGONÓMICA, FIJA Y ESTABLE (SIN MOVIMIENTOS BRUSCOS DE RATÓN)
         ==================================================================== -->
    <a-entity id="rig" position="0 0 0.65">
      <a-camera 
        id="camera" 
        position="0 1.55 0"
        rotation="-32 0 0" 
        look-controls="enabled: false" 
        wasd-controls="enabled: false">
        <!-- Raycaster de ratón y pantalla táctil (interacción directa y suave) -->
        <a-entity 
          cursor="rayOrigin: mouse"
          raycaster="objects: .interactable; interval: 30">
        </a-entity>
      </a-camera>

      <!-- Mandos WebXR para Realidad Virtual -->
      <a-entity laser-controls="hand: right" raycaster="objects: .interactable; interval: 30; lineColor: #38bdf8; lineOpacity: 0.8"></a-entity>
      <a-entity laser-controls="hand: left" raycaster="objects: .interactable; interval: 30; lineColor: #38bdf8; lineOpacity: 0.8"></a-entity>
    </a-entity>
  </a-scene>

  <!-- Script para la navegación de retorno al estudio -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const btnBack = document.getElementById('btn-back-studio');
      if (!btnBack) return;

      const goBack = (e) => {
        if (e) e.stopPropagation();
        window.location.href = 'escena-estudio.html';
      };

      btnBack.addEventListener('click', goBack);
      btnBack.addEventListener('touchend', goBack);

      btnBack.addEventListener('mouseenter', () => {
        document.body.style.cursor = 'pointer';
      });

      btnBack.addEventListener('mouseleave', () => {
        document.body.style.cursor = 'default';
      });
    });
  </script>
</body>
</html>
